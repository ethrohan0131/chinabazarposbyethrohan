<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSBPOS</title>
<link rel="stylesheet" href="styles.css">
<style>
  .edit-modal-table { width:100%; border-collapse:collapse; font-size:13px; }
  .edit-modal-table thead th { background:linear-gradient(135deg,#2563EB,#3B82F6); color:#fff; padding:8px 6px; font-size:11px; text-transform:uppercase; font-weight:700; }
  .edit-modal-table thead th:first-child { border-radius:8px 0 0 0; }
  .edit-modal-table thead th:last-child { border-radius:0 8px 0 0; }
  .edit-modal-table tbody td { padding:7px 6px; border-bottom:1px solid #F1F5F9; vertical-align:middle; }
  .edit-modal-table tbody tr:hover { background:#F8FAFC; }
  .edit-modal-table .ed-input { border:1px solid #D1D5DB; border-radius:5px; padding:5px 6px; font-size:12px; text-align:right; width:70px; background:#fff; }
  .edit-modal-table .ed-input:focus { border-color:#2563EB; outline:none; box-shadow:0 0 0 2px rgba(37,99,235,0.15); }
  .edit-pay-row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:14px; padding:12px 14px; background:linear-gradient(135deg,#0F172A,#1E293B); border-radius:10px; color:#fff; }
  .edit-pay-row label { font-size:12px; color:#94A3B8; font-weight:600; }
  .edit-pay-row input { padding:6px 8px; border:1px solid rgba(255,255,255,0.2); border-radius:6px; background:rgba(255,255,255,0.1); color:#fff; font-size:13px; width:100px; text-align:right; }
  .edit-pay-row input:focus { border-color:#60A5FA; outline:none; }
  .edit-pay-row .ep-due { color:#F87171; font-weight:800; font-size:15px; }
  .edit-pay-row .ep-total { color:#34D399; font-weight:800; font-size:15px; }
  /* Per-product edit modal */
  .pp-edit-modal .modal { max-width:420px; }
  .pp-field { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .pp-field label { width:100px; font-size:13px; font-weight:600; color:#374151; }
  .pp-field input { flex:1; padding:8px 10px; border:1px solid #D1D5DB; border-radius:6px; font-size:14px; text-align:right; }
  .pp-field input:focus { border-color:#2563EB; outline:none; box-shadow:0 0 0 2px rgba(37,99,235,0.15); }
  .pp-item-name { font-size:15px; font-weight:700; color:#1E293B; margin-bottom:4px; }
  .pp-item-barcode { font-size:12px; color:#6B7280; margin-bottom:14px; }
  .pp-subtotal-row { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:#F0FDF4; border-radius:8px; border:1px solid #BBF7D0; margin-top:6px; }
  .pp-subtotal-row span:first-child { font-weight:600; color:#15803D; font-size:13px; }
  .pp-subtotal-row span:last-child { font-weight:800; color:#15803D; font-size:16px; }
  .pp-edit-btn { background:none; border:none; cursor:pointer; font-size:11px; padding:1px 4px; border-radius:4px; transition:all .15s; color:#2563EB; }
  .pp-edit-btn:hover { background:#EFF6FF; transform:scale(1.15); }
</style>
</head>
<body>
<div class="main">
<div class="content">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
    <div><h1 class="page-title" style="margin-bottom:2px;">৳ ক্রয় তালিকা</h1></div>
    <a href="purchase.html" class="btn btn-green">+ নতুন ক্রয় যোগ করুন</a>
  </div>
  <div class="stats-grid">
    <div class="stat-card green"><div class="stat-label">মোট ক্রয়</div><div class="stat-value text-success" id="s-total">0</div></div>
    <div class="stat-card blue"><div class="stat-label">মোট পরিশোধ</div><div class="stat-value text-primary" id="s-paid">0</div></div>
    <div class="stat-card red"><div class="stat-label">মোট বাকি</div><div class="stat-value text-danger" id="s-due">0</div></div>
    <div class="stat-card orange"><div class="stat-label">মোট ইনভয়েস</div><div class="stat-value text-warning" id="s-count">0</div></div>
  </div>
  <div class="table-wrap" style="margin-top:20px;">
    <div class="table-header"><h3>ক্রয় তালিকা</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <div class="search-box"><span class="icon">🔍</span><input type="text" id="f-search" placeholder="ইনভয়েস / সাপ্লাইয়ার..." oninput="renderList()"></div>
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>ইনভয়েস</th><th>তারিখ</th><th>সাপ্লাইয়ার</th><th>আইটেম ও বারকোড</th><th class="text-center">পরিমাণ</th><th class="text-right">মোট</th><th class="text-right">পরিশোধ</th><th class="text-right">বাকি</th><th class="text-center">স্ট্যাটাস</th><th>ইনভয়েস0</th></tr></thead>
        <tbody id="list-body"><tr><td colspan="10" class="empty-row">কোনো ক্রয় নেই।</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
</div>
<div class="modal-overlay" id="edit-purch-modal">
<div class="modal" style="max-width:700px;">
  <div class="modal-header"><h3 id="edit-modal-title">✏️ ক্রয় এডিট</h3><button class="modal-close" onclick="closeModal('edit-purch-modal')">X</button></div>
  <div class="modal-body" id="edit-modal-body"></div>
  <div class="modal-footer">
    <button class="btn btn-outline btn-sm" onclick="closeModal('edit-purch-modal')">বন্ধ</button>
    <button class="btn btn-primary btn-sm" onclick="saveEditPurch()">💾 আপডেট</button>
  </div>
</div>
</div>
<!-- Per-Product Edit Modal -->
<div class="modal-overlay pp-edit-modal" id="pp-edit-modal">
<div class="modal">
  <div class="modal-header"><h3 id="pp-edit-title">✏️ পণ্য এডিট</h3><button class="modal-close" onclick="closeModal('pp-edit-modal')">X</button></div>
  <div class="modal-body" id="pp-edit-body"></div>
  <div class="modal-footer">
    <button class="btn btn-outline btn-sm" onclick="closeModal('pp-edit-modal')">বন্ধ</button>
    <button class="btn btn-primary btn-sm" onclick="savePerProductEdit()">💾 আপডেট</button>
  </div>
</div>
</div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js?v=3"></script>
  <script src="app.js?v=3"></script>
<script>
initPage('purchase-list', 'ক্রয় তালিকা');
let editPurchId = null;
function renderList() {
  const purchases = Store.purchases();
  const search = (document.getElementById('f-search').value||'').toLowerCase();
  let filtered = purchases.filter(p => {
    if (search && !(p.invoiceNo+'').includes(search) && !(p.supplierName||'').toLowerCase().includes(search)) return false;
    return true;
  });
  filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const tbody = document.getElementById('list-body');
  const allItems = Store.items();
  if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="10" class="empty-row">কোনো ক্রয় নেই।</td></tr>'; }
  else { tbody.innerHTML = filtered.map(p => {
    const badge = (p.due||0)>0 ? '<span class="badge badge-danger">বাকি</span>' : '<span class="badge badge-success">পরিশোধিত</span>';
    const totalQty = (p.items||[]).reduce((s, i) => s + (i.qty||0), 0);
    const remainingQty = (p.items||[]).reduce((s, i) => {
      const it = allItems.find(x => x.id === i.itemId);
      const curStock = it ? (it.stock||0) : 0;
      return s + Math.min(curStock, i.qty||0);
    }, 0);
    const itemsHtml = (p.items||[]).map((i,idx) => '<div style="font-size:12px;margin-bottom:2px;display:flex;align-items:center;gap:4px;"><button class="pp-edit-btn" onclick="openPerProductEdit(\''+p.id+'\','+idx+')" title="এডিট">✏️</button><span class="fw-600" style="color:#3B82F6;">'+(i.barcode||'-')+'</span> <span style="color:#4B5563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;display:inline-block;" title="'+i.name+'">'+i.name+'</span> <span style="color:#9CA3AF;">('+i.qty+' '+(i.unit||'pc')+')</span></div>').join('');
    return '<tr'+((p.due||0)>0?' style="background:#fef2f2;"':'')+'>'
      +'<td class="fw-600">#'+p.invoiceNo+'</td><td class="text-muted fs-sm">'+fmtDate(p.date)+'</td><td class="fw-600">'+(p.supplierName||'-')+'</td>'
      +'<td>'+itemsHtml+'</td>'
      +'<td class="text-center"><div style="font-size:13px;font-weight:600;color:var(--text);">ক্রয়: '+totalQty+'</div><div style="font-size:12px;font-weight:600;color:'+(remainingQty>0?'var(--primary)':'#94a3b8')+';">মন্জুদ: '+remainingQty+'</div></td>'
      +'<td class="text-right fw-700">'+fmt(p.grandTotal||0)+'</td><td class="text-right text-success">'+fmt(p.paid||0)+'</td>'
      +'<td class="text-right text-danger fw-700">'+fmt(p.due||0)+'</td><td class="text-center">'+badge+'</td>'
      +'<td><div class="action-btns" style="display:flex;gap:4px;">'
      +'<button class="act-btn" onclick="openEditPurch(\''+p.id+'\')" title="Edit" style="background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:13px;">✏️</button>'
      +'<button class="act-btn delete" onclick="delPurch(\''+p.id+'\')" title="Delete">🗑️</button>'
      +'</div></td></tr>';
  }).join(''); }
  let aT=0,aP=0,aD=0; purchases.forEach(p=>{aT+=p.grandTotal||0;aP+=p.paid||0;aD+=p.due||0;});
  document.getElementById('s-total').textContent = fmt(aT);
  document.getElementById('s-paid').textContent = fmt(aP);
  document.getElementById('s-due').textContent = fmt(aD);
  document.getElementById('s-count').textContent = purchases.length;
}
function openEditPurch(id) {
  const purchases = Store.purchases();
  const p = purchases.find(x => x.id === id);
  if (!p) return;
  editPurchId = id;
  document.getElementById('edit-modal-title').textContent = '✏️ ক্রয় এডিট — #' + p.invoiceNo;
  let rows = (p.items||[]).map(function(it, i) {
    return '<tr>'
      +'<td style="font-weight:600;font-size:12px;">'+it.name+'</td>'
      +'<td style="font-size:11px;color:#6B7280;">'+(it.barcode||'-')+'</td>'
      +'<td><input class="ed-input" type="number" id="eq-'+i+'" value="'+it.qty+'" min="1"></td>'
      +'<td><input class="ed-input" type="number" id="ep-'+i+'" value="'+(it.price||0)+'" step="any"></td>'
      +'<td><input class="ed-input" type="number" id="es-'+i+'" value="'+(it.salePrice||0)+'" step="any"></td>'
      +'<td style="text-align:right;font-weight:700;" id="esub-'+i+'">'+fmt((it.price||0)*(it.qty||0))+'</td>'
      +'<td><button onclick="removeEditItem('+i+')" style="background:#FEE2E2;color:#DC2626;border:none;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12px;">X</button></td>'
      +'</tr>';
  }).join('');
  var html = '<div style="overflow-x:auto;"><table class="edit-modal-table">'
    +'<thead><tr><th>আইটেম</th><th>বারকোড</th><th style="text-align:right;">পরিমাণ</th><th style="text-align:right;">ক্রয় মূল্য</th><th style="text-align:right;">বিক্রয় মূল্য</th><th style="text-align:right;">সাবটোটাল</th><th>মুছুন</th></tr></thead>'
    +'<tbody id="edit-items-body">'+rows+'</tbody>'
    +'</table></div>'
    +'<div class="edit-pay-row">'
    +'<div><label>ডেলিভারি:</label><br><input type="number" id="ed-delivery" value="'+(p.deliveryCharge||0)+'" oninput="calcEditTotals()"></div>'
    +'<div><label>পেমেন্ট:</label><br><input type="number" id="ed-paid" value="'+(p.paid||0)+'" oninput="calcEditTotals()"></div>'
    +'<div><label>মোট:</label><br><span class="ep-total" id="ed-grand">'+fmt(p.grandTotal||0)+'</span></div>'
    +'<div><label>বাকি:</label><br><span class="ep-due" id="ed-due">'+fmt(p.due||0)+'</span></div>'
    +'</div>';
  document.getElementById('edit-modal-body').innerHTML = html;
  (p.items||[]).forEach(function(it, i) {
    ['eq-'+i, 'ep-'+i, 'es-'+i].forEach(function(eid) {
      var el = document.getElementById(eid);
      if (el) el.addEventListener('input', function() { calcEditTotals(); });
    });
  });
  openModal('edit-purch-modal');
}
function removeEditItem(idx) {
  var purchases = Store.purchases();
  var p = purchases.find(function(x) { return x.id === editPurchId; });
  if (!p || !p.items || !p.items[idx]) return;
  if (!confirm('মুছবেন ' + p.items[idx].name + '?')) return;
  var items = Store.items();
  var ci = p.items[idx];
  var it = items.find(function(x) { return x.id === ci.itemId; });
  if (it) { it.stock = Math.max(0, (it.stock||0) - (ci.qty||0)); Store.saveItems(items); }
  p.items.splice(idx, 1);
  var sub = p.items.reduce(function(s,c) { return s + (c.price||0)*(c.qty||0); }, 0);
  p.subtotal = sub;
  p.grandTotal = sub + (p.deliveryCharge||0);
  p.due = p.grandTotal - (p.paid||0);
  Store.savePurch(purchases);
  openEditPurch(editPurchId);
  renderList();
  showToast('আইটেম মুছে ফেলা হয়েছে', 'warning');
}
function calcEditTotals() {
  var purchases = Store.purchases();
  var p = purchases.find(function(x) { return x.id === editPurchId; });
  if (!p) return;
  var sub = 0;
  (p.items||[]).forEach(function(it, i) {
    var q = parseFloat((document.getElementById('eq-'+i)||{}).value) || 0;
    var pr = parseFloat((document.getElementById('ep-'+i)||{}).value) || 0;
    var s = q * pr;
    sub += s;
    var subEl = document.getElementById('esub-'+i);
    if (subEl) subEl.textContent = fmt(s);
  });
  var del = parseFloat((document.getElementById('ed-delivery')||{}).value) || 0;
  var paid = parseFloat((document.getElementById('ed-paid')||{}).value) || 0;
  var grand = sub + del;
  document.getElementById('ed-grand').textContent = fmt(grand);
  document.getElementById('ed-due').textContent = fmt(grand - paid);
}
function saveEditPurch() {
  var purchases = Store.purchases();
  var p = purchases.find(function(x) { return x.id === editPurchId; });
  if (!p) return;
  var items = Store.items();
  var sub = 0;
  (p.items||[]).forEach(function(it, i) {
    var newQty = parseInt((document.getElementById('eq-'+i)||{}).value) || 1;
    var newPrice = parseFloat((document.getElementById('ep-'+i)||{}).value) || 0;
    var newSale = parseFloat((document.getElementById('es-'+i)||{}).value) || 0;
    var qtyDiff = newQty - (it.qty||0);
    var inv = items.find(function(x) { return x.id === it.itemId; });
    if (inv) {
      inv.stock = Math.max(0, (inv.stock||0) + qtyDiff);
      inv.buyPrice = newPrice;
      inv.salePrice = newSale;
    }
    it.qty = newQty;
    it.price = newPrice;
    it.salePrice = newSale;
    sub += newPrice * newQty;
  });
  Store.saveItems(items);
  var del = parseFloat((document.getElementById('ed-delivery')||{}).value) || 0;
  var paid = parseFloat((document.getElementById('ed-paid')||{}).value) || 0;
  p.subtotal = sub;
  p.deliveryCharge = del;
  p.grandTotal = sub + del;
  p.paid = paid;
  p.due = p.grandTotal - paid;
  Store.savePurch(purchases);
  closeModal('edit-purch-modal');
  showToast('ক্রয় আপডেট হয়েছে!', 'success');
  renderList();
}
function delPurch(id) {
  if (!confirm('এই ক্রয় মুছবেন?')) return;
  var purchases = Store.purchases();
  var idx = purchases.findIndex(function(p) { return p.id===id; });
  if (idx<0) return;
  var p = purchases[idx];
  var items = Store.items();
  (p.items||[]).forEach(function(ci) { var it = items.find(function(i) { return i.id===ci.itemId; }); if(it) it.stock = Math.max(0,(it.stock||0)-ci.qty); });
  Store.saveItems(items);
  purchases.splice(idx,1);
  Store.savePurch(purchases);
  showToast('ক্রয় মুছে ফেলা হয়েছে','warning');
  renderList();
}
// ===== PER-PRODUCT EDIT =====
let ppPurchId = null, ppItemIdx = null;
function openPerProductEdit(purchId, idx) {
  var purchases = Store.purchases();
  var p = purchases.find(function(x) { return x.id === purchId; });
  if (!p || !p.items || !p.items[idx]) return;
  ppPurchId = purchId;
  ppItemIdx = idx;
  var it = p.items[idx];
  document.getElementById('pp-edit-title').textContent = '✏️ পণ্য এডিট — #' + p.invoiceNo;
  var html = '<div class="pp-item-name">' + it.name + '</div>'
    + '<div class="pp-item-barcode">বারকোড: ' + (it.barcode || '-') + ' | সাইজ: ' + (it.size || '-') + '</div>'
    + '<div class="pp-field"><label>পরিমাণ</label><input type="number" id="pp-qty" value="' + (it.qty||0) + '" min="1" oninput="calcPPSub()"></div>'
    + '<div class="pp-field"><label>ক্রয় মূল্য</label><input type="number" id="pp-buy" value="' + (it.price||0) + '" step="any" oninput="calcPPSub()"></div>'
    + '<div class="pp-field"><label>বিক্রয় মূল্য</label><input type="number" id="pp-sale" value="' + (it.salePrice||0) + '" step="any"></div>'
    + '<div class="pp-subtotal-row"><span>সাবটোটাল</span><span id="pp-sub">' + fmt((it.price||0) * (it.qty||0)) + '</span></div>';
  document.getElementById('pp-edit-body').innerHTML = html;
  openModal('pp-edit-modal');
}
function calcPPSub() {
  var q = parseFloat((document.getElementById('pp-qty')||{}).value) || 0;
  var pr = parseFloat((document.getElementById('pp-buy')||{}).value) || 0;
  document.getElementById('pp-sub').textContent = fmt(q * pr);
}
function savePerProductEdit() {
  if (ppPurchId === null || ppItemIdx === null) return;
  var purchases = Store.purchases();
  var p = purchases.find(function(x) { return x.id === ppPurchId; });
  if (!p || !p.items || !p.items[ppItemIdx]) return;
  var it = p.items[ppItemIdx];
  var newQty = parseInt(document.getElementById('pp-qty').value) || 1;
  var newBuy = parseFloat(document.getElementById('pp-buy').value) || 0;
  var newSale = parseFloat(document.getElementById('pp-sale').value) || 0;
  // Stock adjustment
  var qtyDiff = newQty - (it.qty || 0);
  var items = Store.items();
  var inv = items.find(function(x) { return x.id === it.itemId; });
  if (inv) {
    inv.stock = Math.max(0, (inv.stock || 0) + qtyDiff);
    inv.buyPrice = newBuy;
    inv.salePrice = newSale;
    Store.saveItems(items);
  }
  // Update purchase item
  it.qty = newQty;
  it.price = newBuy;
  it.salePrice = newSale;
  // Recalculate purchase totals
  var sub = p.items.reduce(function(s, c) { return s + (c.price||0) * (c.qty||0); }, 0);
  p.subtotal = sub;
  p.grandTotal = sub + (p.deliveryCharge || 0);
  p.due = p.grandTotal - (p.paid || 0);
  Store.savePurch(purchases);
  closeModal('pp-edit-modal');
  showToast(it.name + ' আপডেট হয়েছে!', 'success');
  renderList();
}
renderList();
</script>
</body>
</html>
