<!DOCTYPE html>
<html lang="bn">
<head>
<script src="protect.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CHINA BAZAR — রিটার্ন</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="main">
<div class="content">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
    <span class="page-title-bar" style="font-size:16px;font-weight:700;">↩️ রিটার্ন ম্যানেজমেন্ট</span>
  </div>

  <!-- Tab Nav -->
  <div style="display:flex;gap:4px;margin-bottom:16px;background:#F1F5F9;border-radius:10px;padding:4px;">
    <button onclick="switchTab('sale')"     id="tab-sale"     class="tab-btn active-tab">🛒 বিক্রয় রিটার্ন</button>
    <button onclick="switchTab('purchase')" id="tab-purchase" class="tab-btn">📦 ক্রয় রিটার্ন</button>
  </div>
  <style>
    .tab-btn{flex:1;padding:8px 12px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:#64748B;transition:all .2s;}
    .active-tab{background:#fff;color:#2563EB;box-shadow:0 2px 8px rgba(0,0,0,.08);}
    .tab-section{display:none;}.tab-section.show{display:block;}
  </style>

  <!-- ===== SALES RETURN TAB ===== -->
  <div class="tab-section show" id="sec-sale">
    <div class="card">
      <div class="card-title">🛒 বিক্রয় রিটার্ন যোগ</div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;">
        <div class="form-group"><label class="form-label">বিক্রয় ইনভয়েস নং</label>
          <select class="form-control" id="r-invoice" onchange="loadReturnInvoice()"><option value="">সিলেক্ট করুন</option></select></div>
        <div class="form-group"><label class="form-label">তারিখ</label><input type="date" class="form-control" id="r-date"></div>
      </div>
      <div id="r-info" style="margin:8px 0;font-size:13px;color:var(--text-sec);"></div>
      <div id="r-items-area"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px;gap:16px;align-items:center;">
        <span style="font-size:15px;font-weight:700;">মোট (TK.): <span id="r-total">0</span></span>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;margin-top:10px;">
        <div class="form-group"><label class="form-label">পেয়েড এমাউন্ট</label><input type="number" class="form-control" id="r-paid" value="0"></div>
        <div class="form-group"><label class="form-label">পেমেন্ট অ্যাকাউন্ট</label><select class="form-control" id="r-account"><option>নগদ</option><option>বিকাশ</option><option>ব্যাংক</option></select></div>
      </div>
      <div class="btn-row" style="margin-top:10px;"><button class="btn btn-green btn-lg" onclick="saveReturn()">💾 সেভ</button></div>
    </div>

    <!-- Sale Return list -->
    <div class="filter-bar">
      <div class="search-box"><span class="icon">🔍</span><input type="text" id="f-search" placeholder="ইনভয়েস / কাস্টমার..." oninput="renderList()"></div>
    </div>
    <div class="table-wrap">
      <div class="table-header"><h3>🛒 বিক্রয় রিটার্ন তালিকা</h3></div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>তারিখ</th><th>ইনভয়েস</th><th>কাস্টমার</th><th class="text-right">মোট</th><th class="text-right">পেইড</th><th class="text-right">বাকি</th><th></th></tr></thead>
          <tbody id="list-body"><tr><td colspan="7" class="empty-row">কোনো রিটার্ন নেই।</td></tr></tbody>
          <tfoot><tr><td colspan="3">মোট</td><td class="text-right" id="ft-total">৳0</td><td class="text-right" id="ft-paid">৳0</td><td class="text-right" id="ft-due">৳0</td><td></td></tr></tfoot>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== PURCHASE RETURN TAB ===== -->
  <div class="tab-section" id="sec-purchase">
    <div class="card">
      <div class="card-title">📦 ক্রয় রিটার্ন যোগ</div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;">
        <div class="form-group"><label class="form-label">ক্রয় ইনভয়েস নং</label>
          <select class="form-control" id="pr-invoice" onchange="loadPurchReturnInvoice()"><option value="">সিলেক্ট করুন</option></select></div>
        <div class="form-group"><label class="form-label">তারিখ</label><input type="date" class="form-control" id="pr-date"></div>
      </div>
      <div id="pr-info" style="margin:8px 0;font-size:13px;color:var(--text-sec);"></div>
      <div id="pr-items-area"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px;gap:16px;align-items:center;">
        <span style="font-size:15px;font-weight:700;">মোট (TK.): <span id="pr-total">0</span></span>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;margin-top:10px;">
        <div class="form-group"><label class="form-label">পেয়েড এমাউন্ট</label><input type="number" class="form-control" id="pr-paid" value="0"></div>
        <div class="form-group"><label class="form-label">পেমেন্ট অ্যাকাউন্ট</label><select class="form-control" id="pr-account"><option>নগদ</option><option>বিকাশ</option><option>ব্যাংক</option></select></div>
      </div>
      <div class="btn-row" style="margin-top:10px;"><button class="btn btn-primary btn-lg" onclick="savePurchReturn()">💾 সেভ</button></div>
    </div>

    <!-- Purchase Return list -->
    <div class="filter-bar">
      <div class="search-box"><span class="icon">🔍</span><input type="text" id="pf-search" placeholder="ইনভয়েস / সাপ্লাইয়ার..." oninput="renderPurchList()"></div>
    </div>
    <div class="table-wrap">
      <div class="table-header"><h3>📦 ক্রয় রিটার্ন তালিকা</h3></div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>তারিখ</th><th>ইনভয়েস</th><th>সাপ্লাইয়ার</th><th class="text-right">মোট</th><th class="text-right">পেইড</th><th class="text-right">বাকি</th><th></th></tr></thead>
          <tbody id="plist-body"><tr><td colspan="7" class="empty-row">কোনো ক্রয় রিটার্ন নেই।</td></tr></tbody>
          <tfoot><tr><td colspan="3">মোট</td><td class="text-right" id="pft-total">৳0</td><td class="text-right" id="pft-paid">৳0</td><td class="text-right" id="pft-due">৳0</td><td></td></tr></tfoot>
        </table>
      </div>
    </div>
  </div>

</div>
</div>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="app.js"></script>
<script>
window._pageInit = function() {
  document.getElementById('r-date').value = todayStr();
  document.getElementById('pr-date').value = todayStr();
  loadInvoices();
  loadPurchInvoices();
  renderList();
  renderPurchList();
};
initPage('add-return','রিটার্ন');

// ── Tab switch ──
function switchTab(name) {
  document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('show'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
  document.getElementById('sec-' + name).classList.add('show');
  document.getElementById('tab-' + name).classList.add('active-tab');
}

// ════════════════════════════════════
// SALES RETURN
// ════════════════════════════════════
let rCart = [];

function loadInvoices() {
  const sales = Store.sales();
  document.getElementById('r-invoice').innerHTML = '<option value="">সিলেক্ট করুন</option>'
    + sales.map(s => `<option value="${s.id}">#${s.invoiceNo} — ${s.customerName||'Walk-in'} — ${fmt(s.grandTotal)}</option>`).join('');
}

function loadReturnInvoice() {
  const id = document.getElementById('r-invoice').value;
  const s = Store.sales().find(x => x.id === id);
  if (!s) { document.getElementById('r-info').innerHTML=''; document.getElementById('r-items-area').innerHTML=''; rCart=[]; return; }
  document.getElementById('r-info').innerHTML = `<strong>কাস্টমার:</strong> ${s.customerName||'Walk-in'} | <strong>ইনভয়েস:</strong> #${s.invoiceNo} | <strong>তারিখ:</strong> ${fmtDate(s.date)}`;
  rCart = (s.items||[]).map(i => ({...i, retQty: 0}));
  renderRCart();
}

function renderRCart() {
  if (!rCart.length) { document.getElementById('r-items-area').innerHTML=''; return; }
  let html = '<table style="width:100%;font-size:12px;"><thead><tr><th>আইটেম</th><th class="text-right">মূল্য</th><th class="text-right">বিক্রিত</th><th class="text-right">রিটার্ন পরিমাণ</th><th class="text-right">মোট</th></tr></thead><tbody>';
  rCart.forEach((c,i) => {
    html += `<tr><td>${c.name}</td><td class="text-right">৳${c.price}</td><td class="text-right">${c.qty}</td><td class="text-right"><input type="number" class="pos-input" value="${c.retQty}" min="0" max="${c.qty}" onchange="rCart[${i}].retQty=Math.min(parseInt(this.value)||0,${c.qty});calcRTotal();" style="width:70px;"></td><td class="text-right fw-700">৳${c.price*c.retQty}</td></tr>`;
  });
  document.getElementById('r-items-area').innerHTML = html + '</tbody></table>';
  calcRTotal();
}

function calcRTotal() {
  document.getElementById('r-total').textContent = rCart.reduce((s,c)=>s+c.price*c.retQty,0);
}

function saveReturn() {
  const saleId = document.getElementById('r-invoice').value;
  if (!saleId) { showToast('ইনভয়েস সিলেক্ট করুন!','error'); return; }
  const retItems = rCart.filter(c => c.retQty > 0);
  if (!retItems.length) { showToast('রিটার্ন পরিমাণ দিন!','error'); return; }
  const total = retItems.reduce((s,c)=>s+c.price*c.retQty,0);
  const paid = parseFloat(document.getElementById('r-paid').value)||0;
  const sale = Store.sales().find(x=>x.id===saleId);
  const returns = Store.returns();
  returns.push({ id:uid(), type:'sale', saleId, saleInvoiceNo:sale?.invoiceNo||'', date:document.getElementById('r-date').value, customerName:sale?.customerName||'', items:retItems.map(c=>({name:c.name,itemId:c.itemId,price:c.price,qty:c.retQty})), total, paid, due:total-paid, account:document.getElementById('r-account').value, createdAt:new Date().toISOString() });
  Store.saveReturns(returns);
  // Restore stock
  const items = Store.items();
  retItems.forEach(c=>{ const it=items.find(i=>i.id===c.itemId); if(it) it.stock=(it.stock||0)+c.retQty; });
  Store.saveItems(items);
  showToast('বিক্রয় রিটার্ন সেভ হয়েছে!');
  rCart=[]; document.getElementById('r-invoice').value=''; document.getElementById('r-info').innerHTML=''; document.getElementById('r-items-area').innerHTML=''; document.getElementById('r-total').textContent='0';
  renderList();
}

function renderList() {
  const returns = Store.returns().filter(r => !r.type || r.type==='sale');
  const q = (document.getElementById('f-search').value||'').toLowerCase();
  let filtered = returns.filter(r => !q || (r.saleInvoiceNo+'').includes(q) || (r.customerName||'').toLowerCase().includes(q));
  filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let tT=0,tP=0,tD=0;
  const tbody = document.getElementById('list-body');
  tbody.innerHTML = filtered.length ? filtered.map(r=>{ tT+=r.total||0;tP+=r.paid||0;tD+=r.due||0;
    return `<tr><td class="fw-600">${fmtDate(r.date)}</td><td class="fw-600">#${r.saleInvoiceNo||'-'}</td><td>${r.customerName||'-'}</td><td class="text-right fw-700 text-danger">${fmt(r.total)}</td><td class="text-right text-success">${fmt(r.paid)}</td><td class="text-right text-danger">${fmt(r.due)}</td><td><button class="act-btn delete" onclick="delReturn('${r.id}')">🗑️</button></td></tr>`;
  }).join('') : '<tr><td colspan="7" class="empty-row">কোনো রিটার্ন নেই।</td></tr>';
  document.getElementById('ft-total').textContent=fmt(tT);
  document.getElementById('ft-paid').textContent=fmt(tP);
  document.getElementById('ft-due').textContent=fmt(tD);
}

function delReturn(id) {
  if(!confirm('মুছবেন?')) return;
  Store.saveReturns(Store.returns().filter(r=>r.id!==id));
  showToast('মুছে ফেলা হয়েছে','warning');
  renderList();
}

// ════════════════════════════════════
// PURCHASE RETURN
// ════════════════════════════════════
let prCart = [];

function loadPurchInvoices() {
  const purchases = Store.purchases();
  document.getElementById('pr-invoice').innerHTML = '<option value="">সিলেক্ট করুন</option>'
    + purchases.map(p => `<option value="${p.id}">#${p.invoiceNo} — ${p.supplierName||'N/A'} — ${fmt(p.grandTotal)}</option>`).join('');
}

function loadPurchReturnInvoice() {
  const id = document.getElementById('pr-invoice').value;
  const p = Store.purchases().find(x => x.id === id);
  if (!p) { document.getElementById('pr-info').innerHTML=''; document.getElementById('pr-items-area').innerHTML=''; prCart=[]; return; }
  document.getElementById('pr-info').innerHTML = `<strong>সাপ্লাইয়ার:</strong> ${p.supplierName||'N/A'} | <strong>ইনভয়েস:</strong> #${p.invoiceNo} | <strong>তারিখ:</strong> ${fmtDate(p.date)}`;
  prCart = (p.items||[]).map(i => ({...i, retQty:0}));
  renderPRCart();
}

function renderPRCart() {
  if (!prCart.length) { document.getElementById('pr-items-area').innerHTML=''; return; }
  let html = '<table style="width:100%;font-size:12px;"><thead><tr><th>আইটেম</th><th class="text-right">ক্রয় মূল্য</th><th class="text-right">ক্রয় পরিমাণ</th><th class="text-right">রিটার্ন পরিমাণ</th><th class="text-right">মোট</th></tr></thead><tbody>';
  prCart.forEach((c,i) => {
    html += `<tr><td>${c.name}</td><td class="text-right">৳${c.price||0}</td><td class="text-right">${c.qty}</td><td class="text-right"><input type="number" class="pos-input" value="${c.retQty}" min="0" max="${c.qty}" onchange="prCart[${i}].retQty=Math.min(parseInt(this.value)||0,${c.qty});calcPRTotal();" style="width:70px;"></td><td class="text-right fw-700">৳${(c.price||0)*c.retQty}</td></tr>`;
  });
  document.getElementById('pr-items-area').innerHTML = html + '</tbody></table>';
  calcPRTotal();
}

function calcPRTotal() {
  document.getElementById('pr-total').textContent = prCart.reduce((s,c)=>s+(c.price||0)*c.retQty,0);
}

function savePurchReturn() {
  const purchId = document.getElementById('pr-invoice').value;
  if (!purchId) { showToast('ইনভয়েস সিলেক্ট করুন!','error'); return; }
  const retItems = prCart.filter(c => c.retQty > 0);
  if (!retItems.length) { showToast('রিটার্ন পরিমাণ দিন!','error'); return; }
  const total = retItems.reduce((s,c)=>s+(c.price||0)*c.retQty,0);
  const paid = parseFloat(document.getElementById('pr-paid').value)||0;
  const purch = Store.purchases().find(x=>x.id===purchId);
  const returns = Store.returns();
  returns.push({ id:uid(), type:'purchase', purchaseId:purchId, purchaseInvoiceNo:purch?.invoiceNo||'', date:document.getElementById('pr-date').value, supplierName:purch?.supplierName||'', items:retItems.map(c=>({name:c.name,itemId:c.itemId,price:c.price||0,qty:c.retQty})), total, paid, due:total-paid, account:document.getElementById('pr-account').value, createdAt:new Date().toISOString() });
  Store.saveReturns(returns);
  // Deduct stock (returned to supplier so stock goes down)
  const items = Store.items();
  retItems.forEach(c=>{ const it=items.find(i=>i.id===c.itemId); if(it) it.stock=Math.max(0,(it.stock||0)-c.retQty); });
  Store.saveItems(items);
  showToast('ক্রয় রিটার্ন সেভ হয়েছে!');
  prCart=[]; document.getElementById('pr-invoice').value=''; document.getElementById('pr-info').innerHTML=''; document.getElementById('pr-items-area').innerHTML=''; document.getElementById('pr-total').textContent='0';
  renderPurchList();
}

function renderPurchList() {
  const returns = Store.returns().filter(r => r.type==='purchase');
  const q = (document.getElementById('pf-search').value||'').toLowerCase();
  let filtered = returns.filter(r => !q || (r.purchaseInvoiceNo+'').includes(q) || (r.supplierName||'').toLowerCase().includes(q));
  filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let tT=0,tP=0,tD=0;
  const tbody = document.getElementById('plist-body');
  tbody.innerHTML = filtered.length ? filtered.map(r=>{ tT+=r.total||0;tP+=r.paid||0;tD+=r.due||0;
    return `<tr><td class="fw-600">${fmtDate(r.date)}</td><td class="fw-600">#${r.purchaseInvoiceNo||'-'}</td><td>${r.supplierName||'-'}</td><td class="text-right fw-700 text-danger">${fmt(r.total)}</td><td class="text-right text-success">${fmt(r.paid)}</td><td class="text-right text-danger">${fmt(r.due)}</td><td><button class="act-btn delete" onclick="delPurchReturn('${r.id}')">🗑️</button></td></tr>`;
  }).join('') : '<tr><td colspan="7" class="empty-row">কোনো ক্রয় রিটার্ন নেই।</td></tr>';
  document.getElementById('pft-total').textContent=fmt(tT);
  document.getElementById('pft-paid').textContent=fmt(tP);
  document.getElementById('pft-due').textContent=fmt(tD);
}

function delPurchReturn(id) {
  if(!confirm('মুছবেন?')) return;
  Store.saveReturns(Store.returns().filter(r=>r.id!==id));
  showToast('মুছে ফেলা হয়েছে','warning');
  renderPurchList();
}
</script>
</body>
</html>
