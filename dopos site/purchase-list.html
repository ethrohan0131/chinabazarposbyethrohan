<!DOCTYPE html>
<html lang="bn">
<head>
<script src="protect.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSBPOS — ক্রয় তালিকা</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="main">
<div class="content">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
    <div><h1 class="page-title" style="margin-bottom:2px;">📋 ক্রয় তালিকা</h1></div>
    <a href="purchase.html" class="btn btn-green">+ নতুন ক্রয় যোগ করুন</a>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card green"><div class="stat-label">মোট ক্রয়</div><div class="stat-value text-success" id="s-total">৳0</div></div>
    <div class="stat-card blue"><div class="stat-label">মোট পরিশোধ</div><div class="stat-value text-primary" id="s-paid">৳0</div></div>
    <div class="stat-card red"><div class="stat-label">মোট বাকি</div><div class="stat-value text-danger" id="s-due">৳0</div></div>
    <div class="stat-card orange"><div class="stat-label">মোট ইনভয়েস</div><div class="stat-value text-warning" id="s-count">0</div></div>
  </div>

  <!-- Purchase List -->
  <div class="table-wrap" style="margin-top:20px;">
    <div class="table-header"><h3>ক্রয় তালিকা</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <div class="search-box"><span class="icon">🔍</span><input type="text" id="f-search" placeholder="ইনভয়েস / সাপ্লাইয়ার..." oninput="renderList()"></div>
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>ইনভয়েস</th><th>তারিখ</th><th>সাপ্লাইয়ার</th><th class="text-center">পরিমাণ</th><th class="text-right">মোট</th><th class="text-right">পরিশোধ</th><th class="text-right">বাকি</th><th class="text-center">স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead>
        <tbody id="list-body"><tr><td colspan="9" class="empty-row">কোনো ক্রয় নেই।</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="app.js"></script>
<script>
initPage('purchase-list', 'ক্রয় তালিকা');

function renderList() {
  const purchases = Store.purchases();
  const search = (document.getElementById('f-search').value||'').toLowerCase();
  let filtered = purchases.filter(p => {
    if (search && !(p.invoiceNo+'').includes(search) && !(p.supplierName||'').toLowerCase().includes(search)) return false;
    return true;
  });
  filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const tbody = document.getElementById('list-body');
  const allItems = Store.items();
  if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="9" class="empty-row">কোনো ক্রয় নেই।</td></tr>'; }
  else { tbody.innerHTML = filtered.map(p => {
    const badge = (p.due||0)>0 ? '<span class="badge badge-danger">বাকি</span>' : '<span class="badge badge-success">পরিশোধিত</span>';
    const totalQty = (p.items||[]).reduce((s, i) => s + (i.qty||0), 0);
    const remainingQty = (p.items||[]).reduce((s, i) => {
      const it = allItems.find(x => x.id === i.itemId);
      const curStock = it ? (it.stock||0) : 0;
      return s + Math.min(curStock, i.qty||0);
    }, 0);
    
    return `<tr${(p.due||0)>0?' style="background:#fef2f2;"':''}>
      <td class="fw-600">#${p.invoiceNo}</td><td class="text-muted fs-sm">${fmtDate(p.date)}</td><td class="fw-600">${p.supplierName||'-'}</td>
      <td class="text-center">
        <div style="font-size:13px;font-weight:600;color:var(--text);">ক্রয়: ${totalQty}</div>
        <div style="font-size:12px;font-weight:600;color:${remainingQty>0?'var(--primary)':'#94a3b8'};">মজুদ: ${remainingQty}</div>
      </td>
      <td class="text-right fw-700">${fmt(p.grandTotal||0)}</td><td class="text-right text-success">${fmt(p.paid||0)}</td>
      <td class="text-right text-danger fw-700">${fmt(p.due||0)}</td><td class="text-center">${badge}</td>
      <td><div class="action-btns"><button class="act-btn delete" onclick="delPurch('${p.id}')" title="মুছুন">🗑️</button></div></td></tr>`;
  }).join(''); }
  // Stats
  let aT=0,aP=0,aD=0; purchases.forEach(p=>{aT+=p.grandTotal||0;aP+=p.paid||0;aD+=p.due||0;});
  document.getElementById('s-total').textContent = fmt(aT);
  document.getElementById('s-paid').textContent = fmt(aP);
  document.getElementById('s-due').textContent = fmt(aD);
  document.getElementById('s-count').textContent = purchases.length;
}

function delPurch(id) {
  if (!confirm('এই ক্রয় মুছবেন?')) return;
  const purchases = Store.purchases();
  const idx = purchases.findIndex(p=>p.id===id);
  if (idx<0) return;
  const p = purchases[idx];
  const items = Store.items();
  (p.items||[]).forEach(ci => { const it = items.find(i=>i.id===ci.itemId); if(it) it.stock = Math.max(0,(it.stock||0)-ci.qty); });
  Store.saveItems(items);
  purchases.splice(idx,1);
  Store.savePurch(purchases);
  showToast('ক্রয় মুছে ফেলা হয়েছে','warning');
  renderList();
}

renderList();
</script>
</body>
</html>
