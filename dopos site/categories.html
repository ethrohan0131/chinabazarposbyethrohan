<!DOCTYPE html>
<html lang="bn">
<head>
<script src="protect.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSBPOS — ক্যাটাগরি ও ব্র্যান্ড</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="main">
  <div class="content">
    <h1 class="page-title" style="margin-bottom:2px;">🏷️ ক্যাটাগরি, ব্র্যান্ড ও ইউনিট</h1>
    <p class="page-subtitle">আইটেম শ্রেণীবিভাগ ও সেটিংস</p>

    <!-- Tabs -->
    <div style="display:flex;gap:0;margin-bottom:24px;background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--card-border);overflow:hidden;">
      <button class="tab-btn active" onclick="switchTab('cat')" id="tab-cat" style="flex:1;padding:12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--card-bg);color:var(--text-muted);border-bottom:3px solid transparent;transition:all .2s;">🏷️ ক্যাটাগরি</button>
      <button class="tab-btn" onclick="switchTab('brand')" id="tab-brand" style="flex:1;padding:12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--card-bg);color:var(--text-muted);border-bottom:3px solid transparent;transition:all .2s;">🔖 ব্র্যান্ড</button>
      <button class="tab-btn" onclick="switchTab('unit')" id="tab-unit" style="flex:1;padding:12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--card-bg);color:var(--text-muted);border-bottom:3px solid transparent;transition:all .2s;">📏 ইউনিট</button>
    </div>

    <!-- Category Tab -->
    <div id="panel-cat">
      <div class="card">
        <div class="card-title">ক্যাটাগরি যোগ করুন</div>
        <div style="display:flex;gap:10px;"><input type="text" class="form-control" id="c-name" placeholder="ক্যাটাগরি নাম" style="flex:1;"><button class="btn btn-primary" onclick="addCat()">+ যোগ</button></div>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>#</th><th>ক্যাটাগরি নাম</th><th>অ্যাকশন</th></tr></thead><tbody id="cat-body"></tbody></table>
      </div>
    </div>

    <!-- Brand Tab -->
    <div id="panel-brand" style="display:none;">
      <div class="card">
        <div class="card-title">ব্র্যান্ড যোগ করুন</div>
        <div style="display:flex;gap:10px;"><input type="text" class="form-control" id="b-name" placeholder="ব্র্যান্ড নাম" style="flex:1;"><button class="btn btn-primary" onclick="addBrand()">+ যোগ</button></div>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>#</th><th>ব্র্যান্ড নাম</th><th>অ্যাকশন</th></tr></thead><tbody id="brand-body"></tbody></table>
      </div>
    </div>

    <!-- Unit Tab -->
    <div id="panel-unit" style="display:none;">
      <div class="card">
        <div class="card-title">ইউনিট যোগ করুন</div>
        <div style="display:flex;gap:10px;"><input type="text" class="form-control" id="u-name" placeholder="ইউনিট নাম (যেমন: কেজি)" style="flex:1;"><button class="btn btn-primary" onclick="addUnit()">+ যোগ</button></div>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>#</th><th>ইউনিট নাম</th><th>অ্যাকশন</th></tr></thead><tbody id="unit-body"></tbody></table>
      </div>
    </div>
  </div>
</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="app.js"></script>
<script>
initPage('categories', 'ক্যাটাগরি / ব্র্যান্ড');

function switchTab(t) {
  ['cat','brand','unit'].forEach(x => {
    document.getElementById('panel-'+x).style.display = x===t ? 'block' : 'none';
    const btn = document.getElementById('tab-'+x);
    if (x===t) { btn.style.color='var(--primary)'; btn.style.borderBottomColor='var(--primary)'; btn.style.background='rgba(79,70,229,.05)'; }
    else { btn.style.color='var(--text-muted)'; btn.style.borderBottomColor='transparent'; btn.style.background='var(--card-bg)'; }
  });
}
switchTab('cat');

function renderAll() {
  const cats = Store.categories();
  document.getElementById('cat-body').innerHTML = cats.length === 0 ? '<tr><td colspan="3" class="empty-row">কোনো ক্যাটাগরি নেই</td></tr>' :
    cats.map((c,i) => `<tr><td class="text-muted">${i+1}</td><td class="fw-600">${c}</td><td><button class="act-btn delete" onclick="delCat(${i})">🗑️</button></td></tr>`).join('');

  const brands = Store.brands();
  document.getElementById('brand-body').innerHTML = brands.length === 0 ? '<tr><td colspan="3" class="empty-row">কোনো ব্র্যান্ড নেই</td></tr>' :
    brands.map((b,i) => `<tr><td class="text-muted">${i+1}</td><td class="fw-600">${b}</td><td><button class="act-btn delete" onclick="delBrand(${i})">🗑️</button></td></tr>`).join('');

  const units = Store.units();
  document.getElementById('unit-body').innerHTML = units.length === 0 ? '<tr><td colspan="3" class="empty-row">কোনো ইউনিট নেই</td></tr>' :
    units.map((u,i) => `<tr><td class="text-muted">${i+1}</td><td class="fw-600">${u}</td><td><button class="act-btn delete" onclick="delUnit(${i})">🗑️</button></td></tr>`).join('');
}

function addCat() { const v = document.getElementById('c-name').value.trim(); if(!v){showToast('নাম দিন','error');return;} const d=Store.categories();d.push(v);Store.saveCats(d);document.getElementById('c-name').value='';showToast('ক্যাটাগরি যোগ হয়েছে!');renderAll(); }
function delCat(i) { const d=Store.categories();d.splice(i,1);Store.saveCats(d);renderAll(); }
function addBrand() { const v = document.getElementById('b-name').value.trim(); if(!v){showToast('নাম দিন','error');return;} const d=Store.brands();d.push(v);Store.saveBrands(d);document.getElementById('b-name').value='';showToast('ব্র্যান্ড যোগ হয়েছে!');renderAll(); }
function delBrand(i) { const d=Store.brands();d.splice(i,1);Store.saveBrands(d);renderAll(); }
function addUnit() { const v = document.getElementById('u-name').value.trim(); if(!v){showToast('নাম দিন','error');return;} const d=Store.units();d.push(v);Store.saveUnits(d);document.getElementById('u-name').value='';showToast('ইউনিট যোগ হয়েছে!');renderAll(); }
function delUnit(i) { const d=Store.units();d.splice(i,1);Store.saveUnits(d);renderAll(); }

renderAll();
</script>
</body>
</html>
