<!DOCTYPE html>
<html lang="bn">
<head>
<script src="protect.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DSBPOS — সাপ্লাইয়ার</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="main">
<div class="content">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
    <span style="font-size:16px;font-weight:700;">🏭 সাপ্লাইয়ার তালিকা</span>
    <button class="btn btn-green" onclick="openModal('add-supp')">+ নতুন সাপ্লাইয়ার</button>
  </div>
  <div class="filter-bar"><div class="search-box"><span class="icon">🔍</span><input type="text" id="f-search" placeholder="নাম বা প্রতিষ্ঠান..." oninput="render()"></div></div>
  <div class="table-wrap"><div class="table-scroll">
    <table><thead><tr><th>নাম</th><th>প্রতিষ্ঠান</th><th>মোবাইল</th><th>ঠিকানা</th><th class="text-right">বকেয়া</th><th></th></tr></thead>
    <tbody id="tbl-body"><tr><td colspan="6" class="empty-row">কোনো সাপ্লাইয়ার নেই</td></tr></tbody></table>
  </div></div>
</div></div>
<div class="modal-overlay" id="add-supp"><div class="modal" style="max-width:420px;">
  <div class="modal-header"><h3>+ নতুন সাপ্লাইয়ার</h3><button class="modal-close" onclick="closeModal('add-supp')">✕</button></div>
  <div class="modal-body">
    <div class="form-group mb-1"><label class="form-label">নাম *</label><input type="text" class="form-control" id="s-name"></div>
    <div class="form-group mb-1"><label class="form-label">প্রতিষ্ঠান</label><input type="text" class="form-control" id="s-company"></div>
    <div class="form-group mb-1"><label class="form-label">মোবাইল</label><input type="text" class="form-control" id="s-mobile"></div>
    <div class="form-group"><label class="form-label">ঠিকানা</label><input type="text" class="form-control" id="s-addr"></div>
    <input type="hidden" id="s-edit-id">
  </div>
  <div class="modal-footer"><button class="btn btn-ghost btn-sm" onclick="closeModal('add-supp')">বন্ধ</button><button class="btn btn-green btn-sm" onclick="saveSupp()">💾 সেভ</button></div>
</div></div>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="app.js"></script>
<script>
initPage('suppliers','সাপ্লাইয়ার তালিকা');
function render(){
  const supps=Store.suppliers();const search=(document.getElementById('f-search').value||'').toLowerCase();
  let filtered=supps.filter(s=>{if(search&&!(s.name||'').toLowerCase().includes(search)&&!(s.company||'').toLowerCase().includes(search))return false;return true;});
  const tbody=document.getElementById('tbl-body');
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="6" class="empty-row">কোনো সাপ্লাইয়ার নেই</td></tr>';return;}
  tbody.innerHTML=filtered.map(s=>`<tr><td class="fw-600">${s.name}</td><td class="fs-sm">${s.company||'-'}</td><td class="fs-sm">${s.mobile||'-'}</td><td class="fs-sm">${s.address||'-'}</td><td class="text-right fw-700 ${(s.due||0)>0?'text-danger':''}">${fmt(s.due||0)}</td><td><div class="action-btns"><button class="act-btn" onclick="editSupp('${s.id}')">✏️</button><button class="act-btn delete" onclick="delSupp('${s.id}')">🗑️</button></div></td></tr>`).join('');
}
function saveSupp(){
  const name=document.getElementById('s-name').value.trim();if(!name){showToast('নাম দিন!','error');return;}
  const supps=Store.suppliers();const editId=document.getElementById('s-edit-id').value;
  const data={name,company:document.getElementById('s-company').value.trim(),mobile:document.getElementById('s-mobile').value.trim(),address:document.getElementById('s-addr').value.trim()};
  if(editId){const idx=supps.findIndex(s=>s.id===editId);if(idx>=0)Object.assign(supps[idx],data);}
  else{data.id=uid();data.due=0;supps.push(data);}
  Store.saveSupp(supps);closeModal('add-supp');['s-name','s-company','s-mobile','s-addr'].forEach(x=>document.getElementById(x).value='');document.getElementById('s-edit-id').value='';
  showToast(editId?'আপডেট হয়েছে!':'সাপ্লাইয়ার যোগ হয়েছে!');render();
}
function editSupp(id){const s=Store.suppliers().find(x=>x.id===id);if(!s)return;document.getElementById('s-name').value=s.name||'';document.getElementById('s-company').value=s.company||'';document.getElementById('s-mobile').value=s.mobile||'';document.getElementById('s-addr').value=s.address||'';document.getElementById('s-edit-id').value=id;openModal('add-supp');}
function delSupp(id){if(!confirm('মুছবেন?'))return;Store.saveSupp(Store.suppliers().filter(s=>s.id!==id));showToast('মুছে ফেলা হয়েছে','warning');render();}
render();
</script>
</body></html>
