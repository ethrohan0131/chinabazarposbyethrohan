<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHOTOVIEW — কোটেশন</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="main">
  <div class="content">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
      <div><h1 class="page-title" style="margin-bottom:2px;">📝 কোটেশন</h1><p class="page-subtitle" style="margin-bottom:0;">কোটেশন তৈরি ও তালিকা</p></div>
      <button class="btn btn-primary" onclick="openNewQuot()">+ নতুন কোটেশন</button>
    </div>

    <!-- Quotation List -->
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead><tr><th>কোটেশন #</th><th>তারিখ</th><th>গ্রাহক</th><th class="text-right">মোট</th><th class="text-center">স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead>
          <tbody id="tbl-body"><tr><td colspan="6" class="empty-row">কোনো কোটেশন নেই।</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Create Quotation Modal -->
<div class="modal-overlay" id="quot-modal">
  <div class="modal" style="max-width:650px;">
    <div class="modal-header"><h3>📝 নতুন কোটেশন</h3><button class="modal-close" onclick="closeModal('quot-modal')">✕</button></div>
    <div class="modal-body">
      <div class="form-grid" style="grid-template-columns:1fr 1fr;">
        <div class="form-group"><label class="form-label">তারিখ</label><input type="date" class="form-control" id="q-date"></div>
        <div class="form-group"><label class="form-label">গ্রাহক</label><input type="text" class="form-control" id="q-cust" placeholder="গ্রাহকের নাম"></div>
      </div>
      <div class="card-title mt-1">আইটেম</div>
      <div class="search-box mb-1"><span class="icon">🔍</span><input type="text" id="q-search" placeholder="আইটেম সার্চ..." oninput="qSearchItems()" autocomplete="off" style="width:100%;"></div>
      <div id="q-results" style="display:none;border:1px solid var(--card-border);border-radius:8px;max-height:150px;overflow-y:auto;margin-bottom:10px;"></div>
      <div id="q-items"></div>
      <div style="border-top:2px solid var(--card-border);margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;font-size:18px;font-weight:700;">
        <span>মোট</span><span id="q-total">৳0</span>
      </div>
      <div class="form-group mt-1"><label class="form-label">নোট</label><textarea class="form-control" id="q-note" rows="2" placeholder="ঐচ্ছিক নোট"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('quot-modal')">বন্ধ</button>
      <button class="btn btn-primary btn-sm" onclick="saveQuot('draft')">ড্রাফট সেভ</button>
      <button class="btn btn-success btn-sm" onclick="saveQuot('final')">💾 সেভ ও প্রিন্ট</button>
    </div>
  </div>
</div>

<!-- View Quotation Modal -->
<div class="modal-overlay" id="view-modal">
  <div class="modal" style="max-width:450px;">
    <div class="modal-header"><h3>📝 কোটেশন</h3><button class="modal-close" onclick="closeModal('view-modal')">✕</button></div>
    <div class="modal-body" id="view-content"></div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('view-modal')">বন্ধ</button>
      <button class="btn btn-success btn-sm" onclick="printQuot()">🖨️ প্রিন্ট</button>
    </div>
  </div>
</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js?v=3"></script>
  <script src="app.js?v=3"></script>
<script>
initPage('quotation', 'কোটেশন');

let qCart = [];
let nextQNo = 1;

function render() {
  const quots = Store.quotations();
  nextQNo = quots.length + 1;
  const tbody = document.getElementById('tbl-body');
  if (quots.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="empty-row">কোনো কোটেশন নেই।</td></tr>'; return; }
  tbody.innerHTML = [...quots].reverse().map(q => {
    const badge = q.status === 'final' ? '<span class="badge badge-success">ফাইনাল</span>' : '<span class="badge badge-warning">ড্রাফট</span>';
    return `<tr>
      <td class="fw-600">Q-${q.qNo}</td><td class="text-muted fs-sm">${fmtDate(q.date)}</td>
      <td>${q.customer||'—'}</td><td class="text-right fw-700">${fmt(q.total||0)}</td>
      <td class="text-center">${badge}</td>
      <td><div class="action-btns">
        <button class="act-btn view" onclick="viewQuot('${q.id}')" title="দেখুন">👁️</button>
        <button class="act-btn delete" onclick="delQuot('${q.id}')" title="মুছুন">🗑️</button>
      </div></td></tr>`;
  }).join('');
}

function openNewQuot() {
  qCart = [];
  document.getElementById('q-date').value = todayStr();
  document.getElementById('q-cust').value = '';
  document.getElementById('q-note').value = '';
  renderQCart();
  openModal('quot-modal');
}

function qSearchItems() {
  const q = document.getElementById('q-search').value.toLowerCase().trim();
  const box = document.getElementById('q-results');
  if (!q) { box.style.display = 'none'; return; }
  const items = Store.items().filter(i => (i.name||'').toLowerCase().includes(q) || (i.code||'').toLowerCase().includes(q));
  if (items.length === 0) { box.innerHTML = '<div style="padding:10px;color:var(--text-muted);font-size:13px;">পাওয়া যায়নি</div>'; box.style.display = 'block'; return; }
  box.innerHTML = items.slice(0,8).map(i => `<div onclick="addQItem('${i.id}')" style="padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid #f1f5f9;font-size:13px;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background=''"><span class="fw-600">${i.name}</span><span class="text-success">${fmt(i.salePrice||0)}</span></div>`).join('');
  box.style.display = 'block';
}

function addQItem(itemId) {
  const item = Store.items().find(i => i.id === itemId);
  if (!item) return;
  const ex = qCart.find(c => c.itemId === itemId);
  if (ex) { ex.qty++; } else { qCart.push({ itemId: item.id, name: item.name, price: item.salePrice || 0, qty: 1 }); }
  document.getElementById('q-search').value = '';
  document.getElementById('q-results').style.display = 'none';
  renderQCart();
}

function renderQCart() {
  const div = document.getElementById('q-items');
  if (qCart.length === 0) { div.innerHTML = '<div class="empty-row" style="padding:16px;">আইটেম যোগ করুন</div>'; document.getElementById('q-total').textContent = '৳0'; return; }
  let total = 0;
  div.innerHTML = '<table style="width:100%;font-size:13px;"><thead><tr><th style="text-align:left;">আইটেম</th><th style="text-align:right;">মূল্য</th><th style="text-align:right;">পরিমাণ</th><th style="text-align:right;">মোট</th><th></th></tr></thead><tbody>' +
    qCart.map((c, i) => {
      const lt = c.price * c.qty;
      total += lt;
      return `<tr><td>${c.name}</td><td style="text-align:right;">${c.price}</td><td style="text-align:right;"><input type="number" class="pos-input" value="${c.qty}" min="1" onchange="qCart[${i}].qty=parseInt(this.value)||1;renderQCart();" style="width:50px;"></td><td style="text-align:right;font-weight:600;">${fmt(lt)}</td><td><button class="pos-remove" onclick="qCart.splice(${i},1);renderQCart();">✕</button></td></tr>`;
    }).join('') + '</tbody></table>';
  document.getElementById('q-total').textContent = fmt(total);
}

function saveQuot(status) {
  if (qCart.length === 0) { showToast('আইটেম যোগ করুন!', 'error'); return; }
  const total = qCart.reduce((s, c) => s + c.price * c.qty, 0);
  const quots = Store.quotations();
  const q = {
    id: uid(), qNo: quots.length + 1, date: document.getElementById('q-date').value,
    customer: document.getElementById('q-cust').value.trim(), items: [...qCart],
    total, note: document.getElementById('q-note').value.trim(), status, createdAt: new Date().toISOString()
  };
  quots.push(q);
  Store.saveQuot(quots);
  closeModal('quot-modal');
  showToast('কোটেশন সেভ হয়েছে!');
  if (status === 'final') viewQuot(q.id);
  render();
}

function viewQuot(id) {
  const q = Store.quotations().find(x => x.id === id);
  if (!q) return;
  document.getElementById('view-content').innerHTML = `
    <div id="quot-printable" style="font-family:'Courier New',monospace;font-size:12px;line-height:1.7;">
      <div style="text-align:center;"><div style="font-size:15px;font-weight:700;">${Store.shopName()}</div><div style="font-size:10px;color:#666;">${Store.shopAddr()}</div></div>
      <div style="border-top:1px dashed #999;margin:6px 0;"></div>
      <div style="text-align:center;font-size:13px;font-weight:700;letter-spacing:2px;">QUOTATION</div>
      <div style="border-top:1px dashed #999;margin:6px 0;"></div>
      <div style="display:flex;justify-content:space-between;"><span>Q#: ${q.qNo}</span><span>${fmtDate(q.date)}</span></div>
      <div>Customer: ${q.customer || '—'}</div>
      <div style="border-top:1px dashed #999;margin:6px 0;"></div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;"><thead><tr><th style="text-align:left;border-bottom:1px solid #ccc;padding:3px 0;">Item</th><th style="text-align:right;border-bottom:1px solid #ccc;">Qty</th><th style="text-align:right;border-bottom:1px solid #ccc;">Price</th><th style="text-align:right;border-bottom:1px solid #ccc;">Total</th></tr></thead>
      <tbody>${q.items.map(i=>`<tr><td style="padding:2px 0;">${i.name}</td><td style="text-align:right;">${i.qty}</td><td style="text-align:right;">${i.price}</td><td style="text-align:right;">${i.price*i.qty}</td></tr>`).join('')}</tbody></table>
      <div style="border-top:1px dashed #999;margin:6px 0;"></div>
      <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;"><span>Total:</span><span>${Math.round(q.total)}</span></div>
      ${q.note?`<div style="margin-top:6px;font-size:10px;color:#666;">Note: ${q.note}</div>`:''}
    </div>`;
  openModal('view-modal');
}

function printQuot() {
  const c = document.getElementById('quot-printable').innerHTML;
  const w = window.open('','_blank','width=400,height=600');
  w.document.write(`<html><head><title>Quotation</title><style>body{font-family:'Courier New',monospace;font-size:12px;line-height:1.7;padding:10px;max-width:80mm;margin:0 auto;}</style></head><body>${c}</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),400);
}

function delQuot(id) {
  if (!confirm('মুছবেন?')) return;
  Store.saveQuot(Store.quotations().filter(q => q.id !== id));
  showToast('কোটেশন মুছে ফেলা হয়েছে', 'warning');
  render();
}

render();
</script>
</body>
</html>
