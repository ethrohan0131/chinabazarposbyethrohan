<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSBPOS — বিক্রয় তালিকা</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="main">
  <div class="content">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
      <div>
        <h1 class="page-title" style="margin-bottom:2px;">📋 বিক্রয় তালিকা</h1>
        <p class="page-subtitle" style="margin-bottom:0;">সকল বিক্রয় ইনভয়েস</p>
      </div>
      <a href="add-sale.html" class="btn btn-primary btn-lg">🛒 নতুন বিক্রয়</a>
    </div>

    <!-- Summary -->
    <div class="stats-grid">
      <div class="stat-card green"><div class="stat-label">মোট বিক্রয়</div><div class="stat-value text-success" id="s-total">৳0</div></div>
      <div class="stat-card blue"><div class="stat-label">মোট আদায়</div><div class="stat-value text-primary" id="s-paid">৳0</div></div>
      <div class="stat-card red"><div class="stat-label">মোট বাকি</div><div class="stat-value text-danger" id="s-due">৳0</div></div>
      <div class="stat-card orange"><div class="stat-label">মোট ইনভয়েস</div><div class="stat-value text-warning" id="s-count">0</div></div>
    </div>

    <!-- Filters -->
    <div class="card" style="padding:14px 20px;">
      <div class="filter-bar" style="margin-bottom:0;">
        <div class="search-box"><span class="icon">🔍</span><input type="text" id="f-search" placeholder="ইনভয়েস নং বা গ্রাহক..." oninput="render()"></div>
        <input type="date" class="form-control" id="f-from" onchange="render()" style="width:150px;">
        <input type="date" class="form-control" id="f-to" onchange="render()" style="width:150px;">
        <select class="form-control" id="f-status" onchange="render()" style="width:130px;">
          <option value="">সব</option>
          <option value="paid">পরিশোধিত</option>
          <option value="due">বাকি আছে</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()">✕ ক্লিয়ার</button>
      </div>
    </div>

    <!-- Sales Table -->
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>ইনভয়েস</th><th>তারিখ</th><th>গ্রাহক</th>
              <th class="text-right">মোট</th><th class="text-right">পরিশোধ</th>
              <th class="text-right">বাকি</th><th class="text-center">স্ট্যাটাস</th><th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="tbl-body"><tr><td colspan="8" class="empty-row">কোনো বিক্রয় নেই।</td></tr></tbody>
          <tfoot>
            <tr>
              <td colspan="3">মোট</td>
              <td class="text-right" id="ft-total">৳0</td>
              <td class="text-right" id="ft-paid">৳0</td>
              <td class="text-right" id="ft-due">৳0</td>
              <td colspan="2"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <!-- Delete Log -->
    <div class="card" style="margin-top:20px;">
      <div class="card-title"><span class="icon">🗑️</span> ডিলিট লগ</div>
      <div id="del-log"><div class="empty-row">কোনো ডিলিট লগ নেই।</div></div>
    </div>
  </div>
</div>

<!-- View Sale Modal -->
<div class="modal-overlay" id="view-modal">
  <div class="modal" style="max-width:450px;">
    <div class="modal-header"><h3>🧾 ইনভয়েস বিবরণ</h3><button class="modal-close" onclick="closeModal('view-modal')">✕</button></div>
    <div class="modal-body" id="view-content"></div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('view-modal')">বন্ধ</button>
      <button class="btn btn-success btn-sm" onclick="printViewReceipt()">🖨️ প্রিন্ট</button>
    </div>
  </div>
</div>

<!-- Payment Modal -->
<div class="modal-overlay" id="pay-modal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header"><h3>💰 পেমেন্ট গ্রহণ</h3><button class="modal-close" onclick="closeModal('pay-modal')">✕</button></div>
    <div class="modal-body">
      <div class="form-group mb-1"><label class="form-label">বর্তমান বাকি</label><input type="text" class="form-control readonly danger-text" id="p-cur-due" readonly></div>
      <div class="form-group mb-1"><label class="form-label">পরিশোধের পরিমাণ (৳)</label><input type="number" class="form-control" id="p-amount" oninput="calcPayRemain()"></div>
      <div class="form-group"><label class="form-label">পরিশোধের পর বাকি</label><input type="text" class="form-control readonly" id="p-remain" readonly></div>
      <input type="hidden" id="p-sale-id">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('pay-modal')">বন্ধ</button>
      <button class="btn btn-success btn-sm" onclick="submitPay()">✅ সেভ</button>
    </div>
  </div>
</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js?v=3"></script>
  <script src="app.js?v=3"></script>
<script>
initPage('sales', 'বিক্রয় তালিকা');

function render() {
  const sales = Store.sales();
  const search = (document.getElementById('f-search').value || '').toLowerCase();
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  const status = document.getElementById('f-status').value;

  let filtered = sales.filter(s => {
    if (search && !(s.invoiceNo+'').includes(search) && !(s.customerName||'').toLowerCase().includes(search)) return false;
    if (from && s.date < from) return false;
    if (to && s.date > to) return false;
    if (status === 'paid' && (s.due || 0) > 0) return false;
    if (status === 'due' && (s.due || 0) <= 0) return false;
    return true;
  });

  filtered.sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.invoiceNo - a.invoiceNo);

  const tbody = document.getElementById('tbl-body');
  let tTotal = 0, tPaid = 0, tDue = 0;

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-row">কোনো বিক্রয় পাওয়া যায়নি।</td></tr>';
  } else {
    tbody.innerHTML = filtered.map(s => {
      tTotal += s.grandTotal || 0; tPaid += s.paid || 0; tDue += s.due || 0;
      const badge = (s.due || 0) > 0 ? '<span class="badge badge-danger">বাকি</span>' : '<span class="badge badge-success">পরিশোধিত</span>';
      return `<tr${(s.due||0)>0?' style="background:#fef2f2;"':''}>
        <td class="fw-600">#${s.invoiceNo}</td>
        <td class="text-muted fs-sm">${fmtDate(s.date)}</td>
        <td class="fw-600">${s.customerName || 'Walk-in'}</td>
        <td class="text-right fw-700">${fmt(s.grandTotal||0)}</td>
        <td class="text-right text-success">${fmt(s.paid||0)}</td>
        <td class="text-right text-danger fw-700">${fmt(s.due||0)}</td>
        <td class="text-center">${badge}</td>
        <td><div class="action-btns">
          <button class="act-btn view" onclick="viewSale('${s.id}')" title="দেখুন">👁️</button>
          ${(s.due||0)>0?`<button class="act-btn pay" onclick="openPay('${s.id}')" title="পেমেন্ট">💰</button>`:''}
          <button class="act-btn delete" onclick="delSale('${s.id}')" title="মুছুন">🗑️</button>
        </div></td></tr>`;
    }).join('');
  }

  document.getElementById('ft-total').textContent = fmt(tTotal);
  document.getElementById('ft-paid').textContent = fmt(tPaid);
  document.getElementById('ft-due').textContent = fmt(tDue);

  // Summary cards (all sales, not filtered)
  let aTotal=0, aPaid=0, aDue=0;
  sales.forEach(s => { aTotal += s.grandTotal||0; aPaid += s.paid||0; aDue += s.due||0; });
  document.getElementById('s-total').textContent = fmt(aTotal);
  document.getElementById('s-paid').textContent = fmt(aPaid);
  document.getElementById('s-due').textContent = fmt(aDue);
  document.getElementById('s-count').textContent = sales.length;

  renderDelLog();
}

function viewSale(id) {
  const s = Store.sales().find(x => x.id === id);
  if (!s) return;
  document.getElementById('view-content').innerHTML = `
    <div class="receipt" id="receipt-printable">
      <div class="r-center"><div class="r-shop">${Store.shopName()}</div><div class="r-sub">${Store.shopAddr()}</div><div class="r-sub">${Store.shopPhone()}</div></div>
      <div class="r-line"></div>
      <div class="r-center"><div class="r-title">SALES INVOICE</div></div>
      <div class="r-line"></div>
      <div class="r-row"><span>Invoice#: ${s.invoiceNo}</span><span>Date: ${fmtDate(s.date)}</span></div>
      <div class="r-row"><span>Customer: ${s.customerName}</span></div>
      <div class="r-line"></div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead><tr><th style="text-align:left;border-bottom:1px solid #ccc;padding:3px 0;">Item</th><th style="text-align:right;border-bottom:1px solid #ccc;">Qty</th><th style="text-align:right;border-bottom:1px solid #ccc;">Price</th><th style="text-align:right;border-bottom:1px solid #ccc;">Total</th></tr></thead>
        <tbody>${(s.items||[]).map(i => `<tr><td style="padding:2px 0;">${i.name}</td><td style="text-align:right;">${i.qty}</td><td style="text-align:right;">${i.price}</td><td style="text-align:right;">${i.price*i.qty-i.disc}</td></tr>`).join('')}</tbody>
      </table>
      <div class="r-line"></div>
      <div class="r-total-row big"><span>Total:</span><span>${Math.round(s.grandTotal)}</span></div>
      <div class="r-total-row"><span>Paid:</span><span>${s.paid}</span></div>
      ${s.due>0?`<div class="r-total-row r-due"><span>Due:</span><span>${Math.round(s.due)}</span></div>`:''}
      <div class="r-line"></div>
    </div>`;
  openModal('view-modal');
}

function printViewReceipt() {
  const c = document.getElementById('receipt-printable').innerHTML;
  const w = window.open('','_blank','width=400,height=700');
  w.document.write(`<html><head><title>Receipt</title><style>body{font-family:'Courier New',monospace;font-size:12px;line-height:1.7;padding:10px;max-width:80mm;margin:0 auto;}.r-center{text-align:center;}.r-shop{font-size:15px;font-weight:700;}.r-sub{font-size:10px;color:#666;}.r-line{border-top:1px dashed #999;margin:6px 0;}.r-row{display:flex;justify-content:space-between;}.r-title{font-size:13px;font-weight:700;letter-spacing:2px;}.r-total-row{display:flex;justify-content:space-between;padding:2px 0;}.r-total-row.big{font-size:15px;font-weight:700;}.r-due{color:#c00;font-weight:700;}</style></head><body>${c}</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),400);
}

function openPay(id) {
  const s = Store.sales().find(x => x.id === id);
  if (!s) return;
  document.getElementById('p-cur-due').value = fmt(s.due);
  document.getElementById('p-amount').value = '';
  document.getElementById('p-remain').value = fmt(s.due);
  document.getElementById('p-sale-id').value = id;
  openModal('pay-modal');
}

function calcPayRemain() {
  const id = document.getElementById('p-sale-id').value;
  const s = Store.sales().find(x => x.id === id);
  const amt = parseFloat(document.getElementById('p-amount').value) || 0;
  document.getElementById('p-remain').value = fmt((s.due || 0) - amt);
}

function submitPay() {
  const id = document.getElementById('p-sale-id').value;
  const amt = parseFloat(document.getElementById('p-amount').value) || 0;
  if (amt <= 0) { showToast('পরিমাণ দিন!', 'error'); return; }
  const sales = Store.sales();
  const s = sales.find(x => x.id === id);
  if (!s) return;
  if (amt > s.due) { showToast('বাকির চেয়ে বেশি হতে পারবে না!', 'error'); return; }
  s.paid += amt; s.due -= amt;
  Store.saveSales(sales);
  closeModal('pay-modal');
  showToast('পেমেন্ট সফল!', 'success');
  render();
}

function delSale(id) {
  if (!confirm('এই বিক্রয় মুছবেন?')) return;
  const sales = Store.sales();
  const idx = sales.findIndex(x => x.id === id);
  if (idx < 0) return;
  const sale = sales[idx];
  // Log
  const log = Store.saleDelLog();
  log.push({...sale, deletedAt: new Date().toISOString()});
  Store.saveDelLog(log);
  // Restore stock
  const items = Store.items();
  (sale.items||[]).forEach(ci => { const it = items.find(i=>i.id===ci.itemId); if(it) it.stock = (it.stock||0)+ci.qty; });
  Store.saveItems(items);
  sales.splice(idx, 1);
  Store.saveSales(sales);
  showToast('বিক্রয় মুছে ফেলা হয়েছে', 'warning');
  render();
}

function renderDelLog() {
  const log = Store.saleDelLog();
  const div = document.getElementById('del-log');
  if (log.length === 0) { div.innerHTML = '<div class="empty-row">কোনো ডিলিট লগ নেই।</div>'; return; }
  div.innerHTML = `<table><thead><tr><th>ইনভয়েস</th><th>তারিখ</th><th>গ্রাহক</th><th class="text-right">মোট</th><th>মুছার সময়</th></tr></thead><tbody>` +
    log.slice(-10).reverse().map(l => `<tr><td>#${l.invoiceNo}</td><td class="text-muted fs-sm">${fmtDate(l.date)}</td><td>${l.customerName||'Walk-in'}</td><td class="text-right fw-600">${fmt(l.grandTotal||0)}</td><td class="text-muted fs-sm">${new Date(l.deletedAt).toLocaleString('bn-BD')}</td></tr>`).join('') +
    '</tbody></table>';
}

function clearFilters() {
  document.getElementById('f-search').value = '';
  document.getElementById('f-from').value = '';
  document.getElementById('f-to').value = '';
  document.getElementById('f-status').value = '';
  render();
}

render();
</script>
</body>
</html>
